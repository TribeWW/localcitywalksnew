name: Linear PR Updates

# pull_request_target so fork PRs can use LINEAR_API_KEY.
# Keep this job metadata-only: do not check out or run pull request code.
on:
  pull_request_target:
    types: [opened, closed]

permissions:
  contents: read

jobs:
  update-linear:
    # Run when a PR is opened or when it is merged
    if: >
      github.event.action == 'opened' ||
      (github.event.action == 'closed' &&
       github.event.pull_request.merged == true)

    runs-on: ubuntu-latest

    steps:
      - name: Post update to Linear
        # actions/github-script@v7 (v7.1.0)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        with:
          script: |
            const pr = context.payload.pull_request;

            // Find the Linear issue ID in the branch or PR title
            const text = `${pr.head.ref} ${pr.title}`;
            // Underscore is a separator (ABC-123_fix); reject embedded alphanumerics.
            const match = text.match(/(?<![A-Za-z0-9])([A-Z][A-Z0-9]+-\d+)(?![A-Za-z0-9])/);

            if (!match) {
              core.info('No Linear issue ID found. Skipping.');
              return;
            }

            const identifier = match[1];

            const merged = pr.merged === true;

            const comment = merged
              ? `## PR merged successfully

            **PR:** [#${pr.number} – ${pr.title}](${pr.html_url})

            - **Author:** ${pr.user.login}
            - **Merged by:** ${pr.merged_by?.login || 'Unknown'}
            - **Files changed:** ${pr.changed_files}
            - **Additions:** +${pr.additions}
            - **Deletions:** -${pr.deletions}

            The pull request has been merged into \`${pr.base.ref}\`.`
              : `## New pull request opened

            **PR:** [#${pr.number} – ${pr.title}](${pr.html_url})

            - **Author:** ${pr.user.login}
            - **Branch:** \`${pr.head.ref}\`
            - **Files changed:** ${pr.changed_files}
            - **Additions:** +${pr.additions}
            - **Deletions:** -${pr.deletions}

            The pull request is now ready for review.`;

            const response = await fetch(
              'https://api.linear.app/graphql',
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': process.env.LINEAR_API_KEY
                },
                body: JSON.stringify({
                  query: `
                    query {
                      issue(id: "${identifier}") {
                        id
                      }
                    }
                  `
                })
              }
            );

            const result = await response.json();

            if (!response.ok || result.errors) {
              throw new Error(JSON.stringify(result.errors || result));
            }

            const issueId = result.data.issue?.id;

            if (!issueId) {
              throw new Error(`Linear issue ${identifier} not found.`);
            }

            const createResponse = await fetch(
              'https://api.linear.app/graphql',
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': process.env.LINEAR_API_KEY
                },
                body: JSON.stringify({
                  query: `
                    mutation {
                      commentCreate(input: {
                        issueId: "${issueId}"
                        body: ${JSON.stringify(comment)}
                      }) {
                        success
                      }
                    }
                  `
                })
              }
            );

            const created = await createResponse.json();

            if (!createResponse.ok || created.errors ||
                !created.data?.commentCreate?.success) {
              throw new Error(JSON.stringify(created.errors || created));
            }

            core.info(`Posted ${merged ? 'merge' : 'PR'} update to ${identifier}.`);
